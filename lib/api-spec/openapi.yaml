openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: catalog
    description: Product catalog operations
  - name: orders
    description: Cash on delivery order operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List products
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
  /products/{slug}:
    get:
      operationId: getProduct
      tags: [catalog]
      summary: Get a product by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Place a cash on delivery order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResult"
        "400":
          description: Invalid order
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Product:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        category:
          type: string
        price:
          type: number
        originalPrice:
          type: number
        description:
          type: string
        details:
          type: array
          items:
            type: string
        sizes:
          type: array
          items:
            type: string
        color:
          type: string
        fabric:
          type: string
        imageUrl:
          type: string
        featured:
          type: boolean
      required:
        - id
        - slug
        - name
        - category
        - price
        - originalPrice
        - description
        - details
        - sizes
        - color
        - fabric
        - imageUrl
        - featured
    OrderItemInput:
      type: object
      properties:
        productId:
          type: integer
        productName:
          type: string
        size:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
      required:
        - productId
        - productName
        - size
        - quantity
        - unitPrice
    OrderInput:
      type: object
      properties:
        customerName:
          type: string
          minLength: 2
        phone:
          type: string
          minLength: 10
        address:
          type: string
          minLength: 8
        city:
          type: string
          minLength: 2
        pincode:
          type: string
          minLength: 6
          maxLength: 6
        notes:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemInput"
        total:
          type: number
      required:
        - customerName
        - phone
        - address
        - city
        - pincode
        - items
        - total
    OrderResult:
      type: object
      properties:
        orderId:
          type: string
        status:
          type: string
        total:
          type: number
        whatsappUrl:
          type: string
        emailUrl:
          type: string
      required:
        - orderId
        - status
        - total
        - whatsappUrl
        - emailUrl

